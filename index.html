<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0f766e">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
  <title>MediSavings – Αλλαγές Υλικών</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Όλο το top block fixed */
    #topBlock {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      background: var(--gray-50);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* Nav μέσα στο topBlock */
    #topBlock nav {
      position: relative;
    }

    /* Inner wrapper — ίδιο max-width με container */
    .top-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 24px 10px;
    }

    /* Body padding = ύψος topBlock */
    body {
      padding-top: 230px;
    }

    /* Scrollable content */
    .scroll-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 24px;
    }

    /* Sticky table headers μέσα στο table-wrap */
    .table-wrap {
      overflow: visible;
    }
    #mainTable thead th {
      position: sticky;
      top: 230px;
      z-index: 10;
      background: var(--gray-50);
      box-shadow: 0 1px 0 var(--gray-200);
    }
      body:not(.edit-mode) .edit-only { display:none !important; }
    body:not(.edit-mode) button[title="Επεξεργασία"] { display:none !important; }
  </style>
</head>
<body>

<div id="topBlock">

  <nav>
    <span class="logo">Medi<span>Savings</span></span>
    <a href="index.html" class="active"><i class="ti ti-list" style="font-size:15px;vertical-align:-2px;margin-right:4px"></i>Λίστα</a>
    <a href="add.html" class="edit-only"><i class="ti ti-plus" style="font-size:15px;vertical-align:-2px;margin-right:4px"></i>Νέα Αλλαγή</a>
    <a href="stats.html"><i class="ti ti-chart-bar" style="font-size:15px;vertical-align:-2px;margin-right:4px"></i>Στατιστικά</a>
    <span class="spacer"></span>
    <button id="editModeBtn" class="btn btn-outline btn-sm" type="button" style="margin-right:10px;padding:4px 10px;font-size:12px">
      <i class="ti ti-lock" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i><span id="editModeText">Επεξεργασία</span>
    </button>
    <span class="hospital">Mediterraneo Hospital</span>
  </nav>

  <div class="top-inner">

    <!-- Stats -->
    <div class="stats-bar" id="statsBar" style="margin-bottom:10px">
      <div class="stat-card">
        <div class="stat-label">Σύνολο Αλλαγών</div>
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-sub">καταχωρημένες</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Συνολική Εξοικονόμηση</div>
        <div class="stat-value green" id="statSaving">—</div>
        <div class="stat-sub">2025 + Α΄ εξάμηνο 2026</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Όφελος Αγορών 2025</div>
        <div class="stat-value green" id="statPurchases">—</div>
        
      </div>
      <div class="stat-card">
        <div class="stat-label">Μ.Ο. Μείωση Τιμής</div>
        <div class="stat-value" id="statAvgPct">—</div>
        
      </div>
    </div>

    <!-- Filter bar -->
    <div style="display:flex;align-items:center;gap:10px;background:white;border-radius:8px;padding:10px 14px;box-shadow:var(--shadow)">
      <i class="ti ti-search" style="font-size:15px;color:var(--gray-500)"></i>
      <input type="text" id="searchInput" placeholder="Αναζήτηση περιγραφή, κωδικό, εταιρεία..." style="border:none;outline:none;font-size:13px;width:220px;color:var(--gray-800)">
      <button id="clearSearch" onclick="document.getElementById('searchInput').value='';document.getElementById('searchInput').dispatchEvent(new Event('input'))" style="display:none;background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:16px;padding:0 2px" title="Καθαρισμός">✕</button>
      <div style="width:1px;height:20px;background:var(--gray-200)"></div>
      <select id="filterStatus" style="border:none;outline:none;font-size:13px;color:var(--gray-700);cursor:pointer;background:transparent">
        <option value="">Κατάσταση: Όλα</option>
        <option value="active">Ενεργά</option>
        <option value="discontinued">Ανενεργά</option>
        <option value="pending">Εκκρεμή</option>
      </select>
      <select id="filterCategory" style="border:none;outline:none;font-size:13px;color:var(--gray-700);cursor:pointer;background:transparent">
        <option value="">Κατηγορία: Όλες</option>
      </select>
      <select id="filterSupplier" style="border:none;outline:none;font-size:13px;color:var(--gray-700);cursor:pointer;background:transparent">
        <option value="">Εταιρεία: Όλες</option>
      </select>
      <div style="width:1px;height:20px;background:var(--gray-200)"></div>
      <button class="btn btn-outline btn-sm" id="sortOldMaterial" type="button"
        style="padding:4px 10px;font-size:12px;white-space:nowrap"
        title="Ταξινόμηση με βάση την περιγραφή του παλιού υλικού">
        <i class="ti ti-sort-ascending-letters" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>
        Α–Ω
      </button>
      <div style="flex:1"></div>
      <span id="countLabel" style="font-size:12px;color:var(--gray-400)"></span>
      <button class="btn btn-outline btn-sm" id="clearFilters" style="padding:4px 10px;font-size:12px">✕ Καθαρισμός</button>
    </div>

  </div>
</div>

<!-- Scrollable table -->
<div class="scroll-content">
  <div class="table-wrap">
    <div id="loadingState" class="loading"><div class="spinner"></div><p>Φόρτωση...</p></div>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="icon">📦</div><p>Δεν βρέθηκαν αλλαγές υλικών</p>
    </div>
    <div id="cardList" style="display:none;flex-direction:column;gap:8px;padding-bottom:24px"></div>
  </div>
</div>


<script>
(function() {
  var KEY = 'medisavingsEditMode';
  var PASSWORD = 'mediterraneo';

  function isEditMode() {
    return localStorage.getItem(KEY) === '1';
  }

  function applyEditMode() {
    var enabled = isEditMode();
    document.body.classList.toggle('edit-mode', enabled);
    var text = document.getElementById('editModeText');
    var btn = document.getElementById('editModeBtn');
    if (text) text.textContent = enabled ? 'Έξοδος από Επεξεργασία' : 'Επεξεργασία';
    if (btn) {
      var icon = btn.querySelector('i');
      if (icon) icon.className = enabled ? 'ti ti-lock-open' : 'ti ti-lock';
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    applyEditMode();
    document.getElementById('editModeBtn').addEventListener('click', function() {
      if (isEditMode()) {
        localStorage.removeItem(KEY);
        applyEditMode();
        if (typeof renderTable === 'function' && typeof allData !== 'undefined') renderTable(allData);
        return;
      }
      var code = prompt('Κωδικός επεξεργασίας:');
      if (code === null) return;
      if (code === PASSWORD) {
        localStorage.setItem(KEY, '1');
        applyEditMode();
        if (typeof renderTable === 'function' && typeof allData !== 'undefined') renderTable(allData);
      } else {
        alert('Λάθος κωδικός.');
      }
    });
  });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/list.js?v=20260922-periods"></script>

<script>
// Normalize both query and searchable fields without changing displayed text.
function normalizeMaterialSearch(value) {
  return String(value ?? '').normalize('NFD').replace(/\p{M}+/gu, '').toLowerCase();
}

// Keep the existing list filters; make all seven search fields accent-insensitive.
function getFiltered() {
  const search   = normalizeMaterialSearch(document.getElementById('searchInput').value);
  const status   = document.getElementById('filterStatus').value;
  const supplier = document.getElementById('filterSupplier').value;
  const category = document.getElementById('filterCategory').value;
  return allData.filter(r => {
    if (status   && r.status       !== status)   return false;
    if (supplier && r.old_supplier !== supplier)  return false;
    if (category && r.category     !== category)  return false;
    if (search) {
      const hay = normalizeMaterialSearch([r.old_code, r.old_description, r.new_code, r.new_description,
                   r.old_supplier, r.new_supplier, r.category].join(' '));
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var btn = document.getElementById('sortOldMaterial');
  if (!btn) return;

  btn.addEventListener('click', function() {
    if (sortCol === 'old_description' && sortDir === 'asc') {
      sortDir = 'desc';
      btn.innerHTML = '<i class="ti ti-sort-descending-letters" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Ω–Α';
    } else {
      sortCol = 'old_description';
      sortDir = 'asc';
      btn.innerHTML = '<i class="ti ti-sort-ascending-letters" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Α–Ω';
    }
    renderTable(allData);
  });

  var clearFiltersBtn = document.getElementById('clearFilters');
  if (clearFiltersBtn) {
    clearFiltersBtn.addEventListener('click', function() {
      sortCol = 'sort_order';
      sortDir = 'asc';
      btn.innerHTML = '<i class="ti ti-sort-ascending-letters" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>Α–Ω';
      renderTable(allData);
    });
  }
});
</script>


<script>
// Μέτρηση πραγματικού ύψους topBlock και εφαρμογή
function applyOffsets() {
  var h = document.getElementById('topBlock').offsetHeight;
  document.body.style.paddingTop = h + 'px';
  document.querySelectorAll('#mainTable thead th').forEach(function(th) {
    th.style.top = h + 'px';
  });
}
window.addEventListener('load', applyOffsets);
window.addEventListener('resize', applyOffsets);
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
    .then(registration => registration.update())
    .catch(error => console.error('Service worker update failed:', error));
}
</script>
</body>
</html>
