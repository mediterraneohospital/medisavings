<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediSavings – Καταχώρηση Αλλαγής</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .period-row { display:grid; grid-template-columns:120px 1fr 1fr 1fr 1fr auto; gap:8px; align-items:start; padding:12px; background:var(--gray-50); border-radius:8px; margin-bottom:8px; }
    .period-row .form-group { margin:0; }
    .period-row label { font-size:11px; }
    .periods-header { display:grid; grid-template-columns:120px 1fr 1fr 1fr 1fr auto; gap:8px; padding:0 12px; margin-bottom:4px; }
    .periods-header span { font-size:11px; font-weight:600; color:var(--gray-600); text-transform:uppercase; }
    .add-period-btn { background:var(--teal-subtle); border:1px dashed var(--teal); color:var(--teal); border-radius:8px; padding:10px; width:100%; cursor:pointer; font-size:13px; font-weight:600; margin-top:8px; }
    .add-period-btn:hover { background:var(--teal-light); }
    .del-period { background:none; border:none; color:var(--gray-400); cursor:pointer; font-size:16px; padding:4px; }
    .del-period:hover { color:var(--red); }
    .manual-badge { font-size:10px; color:var(--yellow); font-weight:600; }
  </style>
</head>
<body>
<nav>
  <span class="logo">Medi<span>Savings</span></span>
  <a href="index.html">📋 Λίστα</a>
  <a href="add.html" class="active">➕ Νέα Αλλαγή</a>
  <span class="spacer"></span>
  <span class="hospital">Mediterraneo Hospital</span>
</nav>

<div class="container">
  <div class="page-header">
    <div class="page-title" id="pageTitle">➕ Νέα Αλλαγή Υλικού</div>
    <a href="index.html" class="btn btn-outline">← Πίσω στη Λίστα</a>
  </div>

  <!-- Παλιό / Νέο Υλικό -->
  <div class="two-sections">
    <div class="form-card">
      <div class="form-section-title">📦 Παλιό Υλικό</div>
      <div class="form-grid">
        <div class="form-group"><label>Κωδικός *</label><input type="text" id="old_code" placeholder="π.χ. 11000032-1"></div>
        <div class="form-group"><label>Εταιρεία</label><input type="text" id="old_supplier" placeholder="π.χ. Paul Hartmann"></div>
        <div class="form-group" style="grid-column:1/-1"><label>Περιγραφή *</label><input type="text" id="old_description"></div>
        <div class="form-group"><label>Παλιά Τιμή (€) *</label><input type="number" id="old_price" step="0.0001" placeholder="0.0000"></div>
      </div>
    </div>
    <div class="form-card">
      <div class="form-section-title">✅ Νέο Υλικό</div>
      <div class="form-grid">
        <div class="form-group"><label>Κωδικός *</label><input type="text" id="new_code" placeholder="π.χ. 11000032"></div>
        <div class="form-group"><label>Εταιρεία</label><input type="text" id="new_supplier" placeholder="π.χ. ΤΑΜΠΟΥ"></div>
        <div class="form-group" style="grid-column:1/-1"><label>Περιγραφή</label><input type="text" id="new_description"></div>
        <div class="form-group"><label>Τρέχουσα Τιμή (€) *</label><input type="number" id="new_price" step="0.0001" placeholder="0.0000"><span class="hint">Πάντα η τελευταία τιμή</span></div>
      </div>
    </div>
  </div>

  <!-- Περίοδοι -->
  <div class="form-card">
    <div class="form-section-title">📊 Ιστορικό Περιόδων</div>
    <div class="periods-header">
      <span>Περίοδος</span>
      <span>Αγορές (τεμ.)</span>
      <span>Τιμή που ίσχυε (€)</span>
      <span>Όφελος (€)</span>
      <span>Σημειώσεις</span>
      <span></span>
    </div>
    <div id="periodsContainer"></div>
    <button class="add-period-btn" onclick="addPeriod()">+ Προσθήκη Περιόδου</button>
  </div>

  <!-- Metadata -->
  <div class="form-card">
    <div class="form-section-title">🏷️ Πρόσθετα Στοιχεία</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Κατηγορία</label>
        <select id="category">
          <option value="">— Επιλογή —</option>
          <option>Γάντια</option><option>Γάζες & Επιδέσμοι</option>
          <option>Σύριγγες & Βελόνες</option><option>Καθετήρες</option>
          <option>Αποστειρωμένα Πεδία</option><option>Ρούχα & Σκουφιά</option>
          <option>Μάσκες & Φίλτρα</option><option>Υλικά Αναισθησίας</option>
          <option>Υγιεινή & Καθαριότητα</option><option>Λοιπά Αναλώσιμα</option>
        </select>
      </div>
      <div class="form-group">
        <label>Κατάσταση</label>
        <select id="status">
          <option value="active">Ενεργό</option>
          <option value="pending">Εκκρεμεί</option>
          <option value="discontinued">Ανενεργό</option>
        </select>
      </div>
      <div class="form-group">
        <label>Ημερομηνία Αλλαγής</label>
        <input type="date" id="change_date">
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--red-light);border:1px solid var(--red);border-radius:8px">
        <input type="checkbox" id="is_discontinued" style="width:18px;height:18px;accent-color:var(--red);cursor:pointer">
        <label for="is_discontinued" style="cursor:pointer;color:var(--red);font-weight:600;margin:0">🚫 Καταργημένο υλικό</label>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Σημειώσεις</label>
        <textarea id="notes" placeholder="Αιτιολογία αλλαγής, σχόλια..."></textarea>
      </div>
    </div>
  </div>

  <div style="display:flex;gap:12px;justify-content:flex-end;margin-bottom:40px;">
    <a href="index.html" class="btn btn-outline">Ακύρωση</a>
    <button class="btn btn-primary" id="saveBtn" onclick="saveRecord()">💾 Αποθήκευση</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/form.js"></script>
</body>
</html>
